# Corpus test-fixture manifest — the single source of truth for the committed bill
# set the CI correctness gates run against. See docs/decisions/0015-corpus-test-fixtures.md.
#
# WHY THIS FILE EXISTS
# The corpus correctness gates (tests/test_corpus_properties.py,
# tests/test_corpus_tree_properties.py, tests/test_diff_validation.py) used to
# parametrize over `bills/*/[0-9]*_*.xml` discovered at collection time. `bills/` is
# gitignored, so the collected set was whatever each machine had fetched: counts were
# not reproducible, and on an unfetched checkout (including CI) the gates collected
# zero cases and passed green with no assertions — the fail-open trap ADR 0009 exists
# to prevent. This manifest replaces that glob: the gates parametrize over exactly the
# bills named here, every one of which is committed to git, so the collected set is
# byte-identical on every machine and in CI.
#
# HOW THE GATES READ IT
# tests/conftest.py loads this file once (stdlib tomllib) and derives the XML-file
# list, the PDF-file list, and the adjacent-version pairs the gates parametrize over.
# A file `bills/<id>/<stage>.<format>` is built for every (bill, version, format)
# below. Because those files are committed, a normal checkout always has them; the
# per-module completeness floor (test_manifest_fixtures_committed) fails closed if any
# is absent — that is the CI signal that a manifested fixture was not committed.
#
# ADDING A FIXTURE — see the "Add a corpus fixture" recipe in TESTING.md. In short:
# `git add` the bill files under bills/<id>/, add a [[bill]] entry here, and run the
# gates so any per-bill baseline (_KNOWN_DUPLICATE_COUNTS, _XML_DROP_BUDGET, ...) is
# calibrated. Manifest and committed files must move together.
#
# SCOPE (#217 / #126): this is the initial curated floor — the bills the gates encode
# hand-pinned baselines for, plus one bill per appropriations subcommittee and the
# key structural shapes (omnibus, enrolled, minibus, reconciliation, Senate print).
# Broadening the curation (e.g. per-subcommittee reported-House PDFs) is #126. The
# opt-in `CORPUS_SWEEP=1` exploratory mode still sweeps every locally-fetched bill.

# --- Diff-validation baselines -------------------------------------------------

[[bill]]
id = "118-hr-4366"
subcommittee = "milcon-va / full-year omnibus"
covers = "Primary diff-validation baselines: controlled small diff (v1->v2, same structure) and no-division->omnibus structure expansion (v1->v6). Hand-curated assertions live in test_diff_validation TestControlledDiff / TestStructureExpansion."
versions = [
  { stage = "1_reported-in-house", formats = ["xml"] },
  { stage = "2_engrossed-in-house", formats = ["xml"] },
  { stage = "4_engrossed-amendment-senate", formats = ["xml"] },
  { stage = "5_engrossed-amendment-house", formats = ["xml"] },
  { stage = "6_enrolled-bill", formats = ["xml"] },
]

[[bill]]
id = "115-hr-5895"
subcommittee = "energy-water / legislative-branch / milcon-va (minibus)"
covers = "Dead-zone similarity baseline (v4->v5, the corpus's densest 0.4-0.6 similarity gap; test_diff_validation TestDeadZoneBaseline) and multi-division minibus coverage — supplies the Legislative Branch subcommittee the Senate set omits."
versions = [
  { stage = "4_engrossed-amendment-senate", formats = ["xml"] },
  { stage = "5_enrolled-bill", formats = ["xml"] },
]

# --- Structural-shape coverage -------------------------------------------------

[[bill]]
id = "113-hr-3547"
subcommittee = "full-year omnibus (enrolled)"
covers = "Enrolled multi-division omnibus whose later titles spill out as orphan <title> siblings — the #146/#167 duplicate-match_path proof case (_KNOWN_DUPLICATE_COUNTS = 168, _XML_DROP_BUDGET = 1)."
versions = [
  { stage = "6_enrolled-bill", formats = ["xml"] },
]

[[bill]]
id = "119-hr-1"
subcommittee = "reconciliation (not appropriations)"
covers = "Reconciliation bill carried as an overfitting smoke case: twin genuinely-distinct Sec. 10012 (real source duplicate, not a parser bug) and provision-body amounts an appropriations parser does not node-ize (_XML_DROP_BUDGET = 15)."
versions = [
  { stage = "1_reported-in-house", formats = ["xml"] },
]


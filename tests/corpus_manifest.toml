# --- Account-vocabulary floor bills (previously fetch-only) --------------------
# Both were named by tests/test_pdf_anchor_golden.py's account-vocab floor gate as
# `bills/<id>` — the gitignored download tree — so CI collected NO case for either and 2
# of that gate's 8 bills were permanently skipped there. 118-hr-4820 is the bill the
# gate's floors are CALIBRATED on ("the lowest measured value: vrec 0.64 / vprec 0.46"),
# so the floor was anchored to a measurement no CI run could reproduce. Committing the
# pair is what turns that gate's stated coverage into its actual coverage.
#
# One version each, in both formats, because the gate measures PDF-detected account
# vocabulary against the XML of the SAME version — a stage committed in one format

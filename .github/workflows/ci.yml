name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Each check runs even if an earlier one failed (but not after cancellation),
      # so one push surfaces every problem at once instead of failing fast on the
      # first gate. The job still goes red if any step fails.
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Run tests
        if: ${{ !cancelled() }}
        run: uv run pytest -m "not slow and not browser" -v

      - name: Install Playwright browser
        if: ${{ !cancelled() }}
        # Chromium only; --with-deps pulls the OS libraries the browser needs on
        # the Ubuntu runner. ~hundreds of MB but cached between runs by the image.
        run: uv run playwright install --with-deps chromium

      - name: Run browser tests
        if: ${{ !cancelled() }}
        run: uv run pytest -m browser -v

      - name: Run external-validation suite
        if: ${{ !cancelled() }}
        # The committee-report validation is @slow but self-contained: it runs against the
        # vendored govinfo sources (committee-report HTML + reported-bill XML), so it can gate
        # CI.
        #
        # test_validate_extraction.py runs WHOLE rather than by nodeid. The two names it
        # used to be selected by are parametrized, so they already pulled in most of the
        # module -- but seven cases (the TestLegBranchValidation class) were collected by
        # no CI step. Five assert on a fresh clone; the other two skip, and are declared in
        # ALLOWED_CI_SLOW_SKIPS so they are watched rather than silent. Selecting a module
        # by nodeid is what let the gap open, so it is selected by path now.
        run: >
          uv run pytest -v -m slow
          tests/test_committee_report.py
          tests/test_validate_extraction.py

      - name: Run corpus correctness gates (committed manifest)
        if: ${{ !cancelled() }}
        # These six @slow gates parametrize over the committed fixture set in
        # tests/corpus_manifest.toml (ADR 0015 / #217 / #220): a byte-identical offline
        # corpus, no fetch. Each module's test_manifest_fixtures_committed floor fails
        # CLOSED if a manifested bill is uncommitted, so a missing fixture goes red rather
        # than silently collecting fewer cases. Before this, they ran only locally over a
        # fetched glob and never in CI (fail open). The last three were migrated in #220 --
        # listing them here is what actually gives them CI coverage; committing their
        # fixtures only made them runnable. CORPUS_SWEEP=1 is the opt-in local superset.
        #
        # test_financial_callout_whole_item is the seventh, and the odd one out: it is not
        # manifest-parametrized, it diffs one committed pair (119-hr-1 v1 -> v2) to prove a
        # wholly-removed appropriation is not rendered silently (#86). It is @slow, so
        # every other step skipped it and it had never run in CI at all. Committing v2 made
        # it runnable; naming it here is what makes it run. Its skipif channel is watched by
        # the content-skip ceiling (CORPUS_GATE_MODULES in tests/conftest.py), so deleting
        # the fixture goes red instead of quiet.
        run: >
          uv run pytest -v -m slow
          tests/test_corpus_properties.py
          tests/test_corpus_tree_properties.py
          tests/test_diff_validation.py
          tests/test_node_join_corpus.py
          tests/test_xml_subsection_nodes.py
          tests/test_pdf_subsection_recall.py
          tests/test_financial_callout_whole_item.py

      - name: Run remaining slow suites (committed fixtures)
        if: ${{ !cancelled() }}
        # These @slow modules already passed on any fresh clone, in ~20s, against
        # committed fixtures — and were named by no CI step, so they never ran here.
        # Committing a fixture makes a gate RUNNABLE; naming its module is what makes it
        # RUN (the distinction #220 drew for the corpus gates). ~95 assertions, free.
        #
        # Their skips are not free: a skip asserts nothing, so every one is declared in
        # ALLOWED_CI_SLOW_SKIPS (tests/conftest.py) and a NEW one fails the session. Most
        # entries are a fixture this repo does not commit, i.e. a coverage gap #126 should
        # shrink — kept separate from the corpus content-skip allowlist for that reason.
        #
        # The allowlist covers a module's WHOLE skip surface, not just what this step
        # collects: the hook runs in every session, so a non-slow case in one of these
        # modules (test_bill_tree.py has one) is watched in the fast step too.
        #
        # Every case CI collects here is watched. Two of these modules glob bills/ instead
        # of the manifest, so a developer with a fetched corpus collects cases CI never
        # sees (6 -> 90, 30 -> 432); those are excluded from the ceiling, because no
        # allowlist calibrated on the committed corpus could name them and the session
        # would go red locally while CI was green. See is_watched_case in tests/conftest.py.
        #
        # Deliberately excluded: test_govinfo_corpus_parity.py, which fetches BILLSTATUS
        # live and so is not an offline gate. test_financial_callout_whole_item.py was the
        # other exclusion pending its fixture; that landed in #320, which put it in the
        # corpus-gate step above and under the #220 ceiling, so it is covered there rather
        # than here.
        run: >
          uv run pytest -v -m slow
          tests/test_pdf_corpus_smoke.py
          tests/test_bill_tree.py
          tests/test_structure_tree.py
          tests/test_diff_bill.py
          tests/test_pdf_compare.py
          tests/test_financial_diff.py
          tests/test_pipeline_parity.py
          tests/test_pdf_xml_amount_recall.py
          tests/test_front_matter_parity.py
          tests/test_xml_compare.py
          tests/test_toc_tree.py
          tests/test_format_html.py
          tests/test_canonical_tree.py
          tests/test_reconcile.py
          tests/test_pdf_watermark_recall.py
          tests/test_formatters_text_serializer.py
